<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media player & chat</title>
    <style>
      :root {
        --bg: #0f1114;
        --surface: #1a1d23;
        --surface-2: #242830;
        --border: #2e3440;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --accent: #5b8def;
        --accent-hover: #7aa3f5;
        --chat-bubble: #2d3340;
        --radius: 10px;
        --font: system-ui, "Segoe UI", Roboto, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        line-height: 1.5;
      }

      .app {
        max-width: 1200px;
        margin: 0 auto;
        padding: 1.25rem;
        display: grid;
        gap: 1rem;
        grid-template-columns: 1fr minmax(280px, 340px);
        align-items: stretch;
        min-height: 100vh;
      }

      @media (max-width: 900px) {
        .app {
          grid-template-columns: 1fr;
        }
      }

      .player-panel {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .player-shell {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      }

      .video-wrap {
        position: relative;
        aspect-ratio: 16 / 9;
        background: #000;
      }

      .video-wrap video {
        width: 100%;
        height: 100%;
        display: block;
      }

      .video-wrap iframe,
      .video-wrap #youtubeFrame {
        width: 100%;
        height: 100%;
        border: 0;
        display: none;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 0.75rem;
        padding: 0.65rem 0.85rem;
        background: var(--surface-2);
        border-top: 1px solid var(--border);
      }

      .controls button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 2.25rem;
        height: 2.25rem;
        padding: 0 0.5rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-size: 0.9rem;
      }

      .controls button:hover {
        border-color: var(--accent);
        color: var(--accent-hover);
      }

      .controls button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .progress-row {
        flex: 1 1 100%;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .time {
        font-variant-numeric: tabular-nums;
        font-size: 0.8rem;
        color: var(--muted);
        white-space: nowrap;
      }

      input[type="range"].seek {
        flex: 1;
        height: 6px;
        accent-color: var(--accent);
        cursor: pointer;
      }

      input[type="range"].vol {
        width: 88px;
        accent-color: var(--accent);
        cursor: pointer;
      }

      .source-row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        align-items: center;
      }

      .source-row label {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .source-row input[type="url"],
      .source-row input[type="file"] {
        flex: 1 1 180px;
        min-width: 0;
        padding: 0.45rem 0.6rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-size: 0.85rem;
      }

      .source-row button.apply {
        padding: 0.45rem 0.85rem;
        border-radius: 6px;
        border: none;
        background: var(--accent);
        color: #0b0d10;
        font-weight: 600;
        cursor: pointer;
        font: inherit;
        font-size: 0.85rem;
      }

      .source-row button.apply:hover {
        background: var(--accent-hover);
      }

      .chat-panel {
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        min-height: 420px;
        max-height: min(85vh, 720px);
      }

      .chat-header {
        padding: 0.75rem 1rem;
        background: var(--surface-2);
        border-bottom: 1px solid var(--border);
        font-weight: 600;
        font-size: 0.95rem;
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 0.75rem 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }

      .msg {
        max-width: 95%;
        align-self: flex-start;
        padding: 0.5rem 0.75rem;
        border-radius: 8px 8px 8px 2px;
        background: var(--chat-bubble);
        font-size: 0.9rem;
        word-break: break-word;
      }

      .msg .meta {
        font-size: 0.72rem;
        color: var(--muted);
        margin-bottom: 0.2rem;
      }

      .msg.system {
        align-self: center;
        background: transparent;
        border: 1px dashed var(--border);
        font-size: 0.8rem;
        color: var(--muted);
      }

      .chat-form {
        display: flex;
        gap: 0.5rem;
        padding: 0.75rem;
        border-top: 1px solid var(--border);
        background: var(--surface-2);
      }

      .chat-form input[type="text"] {
        flex: 1;
        min-width: 0;
        padding: 0.55rem 0.75rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-size: 0.9rem;
      }

      .chat-form input[type="text"]:focus {
        outline: none;
        border-color: var(--accent);
      }

      .chat-form button {
        padding: 0.55rem 1rem;
        border-radius: 6px;
        border: none;
        background: var(--accent);
        color: #0b0d10;
        font-weight: 600;
        cursor: pointer;
        font: inherit;
        font-size: 0.9rem;
      }

      .chat-form button:hover {
        background: var(--accent-hover);
      }

      .draw-window {
        position: fixed;
        top: 84px;
        right: 18px;
        width: min(420px, calc(100vw - 32px));
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 16px 60px rgba(0, 0, 0, 0.5);
        overflow: hidden;
        z-index: 50;
        display: none;
      }

      .draw-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem 1rem;
        background: var(--surface-2);
        border-bottom: 1px solid var(--border);
        font-weight: 600;
        cursor: grab;
        user-select: none;
      }

      .draw-body {
        padding: 0.85rem 1rem 1rem;
        display: grid;
        gap: 0.75rem;
      }

      .draw-canvas {
        width: 100%;
        height: 260px;
        background: #fff;
        border-radius: 8px;
        border: 1px solid var(--border);
        touch-action: none;
        display: block;
      }

      .draw-toolbar {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
      }

      .draw-toolbar .group {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }

      .draw-toolbar label {
        font-size: 0.8rem;
        color: var(--muted);
      }

      .draw-toolbar input[type="color"] {
        width: 2.25rem;
        height: 2.25rem;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
      }

      .draw-toolbar input[type="range"] {
        width: 9rem;
        accent-color: var(--accent);
      }

      .modal-actions {
        display: flex;
        gap: 0.5rem;
        justify-content: flex-end;
      }

      .modal-actions button {
        height: 2.25rem;
        padding: 0 0.85rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-size: 0.9rem;
      }

      .modal-actions button.primary {
        border: none;
        background: var(--accent);
        color: #0b0d10;
        font-weight: 700;
      }

      .msg img.drawing {
        max-width: 100%;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #fff;
        display: block;
      }

      h1.page-title {
        margin: 0 0 0.25rem;
        font-size: 1.25rem;
        font-weight: 600;
      }

      .subtitle {
        margin: 0 0 0.5rem;
        font-size: 0.85rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="player-panel">
        <header>
          <h1 class="page-title">Media player</h1>
          <p class="subtitle">Play video or audio; chat updates as you watch.</p>
        </header>

        <div class="player-shell">
          <div class="video-wrap">
            <video
              id="media"
              playsinline
              preload="metadata"
              poster=""
            >
              <source
                src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
                type="video/mp4"
              />
              Your browser does not support HTML5 video.
            </video>
            <div
              id="youtubeFrame"
              title="YouTube player"
              style="display: none; width: 100%; height: 100%"
            ></div>
          </div>
          <div class="controls" role="toolbar" aria-label="Playback controls">
            <button type="button" id="btnPlay" aria-label="Play">▶</button>
            <div class="progress-row">
              <span class="time" id="timeCurrent">0:00</span>
              <input
                type="range"
                class="seek"
                id="seek"
                min="0"
                max="1000"
                value="0"
                step="1"
                aria-label="Seek"
              />
              <span class="time" id="timeDuration">0:00</span>
            </div>
            <button type="button" id="btnMute" aria-label="Mute">🔊</button>
            <input
              type="range"
              class="vol"
              id="volume"
              min="0"
              max="1"
              value="1"
              step="0.05"
              aria-label="Volume"
            />
            <button type="button" id="btnFs" aria-label="Fullscreen">⛶</button>
          </div>
        </div>

        <div class="source-row">
          <label for="urlInput">URL</label>
          <input
            id="urlInput"
            type="url"
            placeholder="https://… (video or audio)"
            autocomplete="off"
          />
          <button type="button" class="apply" id="btnLoadUrl">Load URL</button>
          <label for="fileInput">File</label>
          <input id="fileInput" type="file" accept="video/*,audio/*" />
        </div>
      </div>

      <aside class="chat-panel" aria-label="Chat">
        <div class="chat-header">
          Live chat
          <span style="float: right; display: inline-flex; gap: 0.6rem; align-items: center">
            <span style="display: inline-flex; flex-direction: column; gap: 0.35rem; align-items: flex-end">
              <span style="display: inline-flex; flex-direction: column; gap: 0.2rem; align-items: flex-end">
                <label for="roomCode" style="font-size: 0.8rem; color: var(--muted)">Room</label>
                <input
                  id="roomCode"
                  type="text"
                  maxlength="10"
                  placeholder="LOBBY"
                  autocomplete="off"
                  style="
                    width: 10.5rem;
                    padding: 0.25rem 0.4rem;
                    border-radius: 6px;
                    border: 1px solid var(--border);
                    background: var(--surface);
                    color: var(--text);
                    font: inherit;
                    font-size: 0.85rem;
                    text-transform: uppercase;
                  "
                />
              </span>
              <span style="display: inline-flex; flex-direction: column; gap: 0.2rem; align-items: flex-end">
                <label for="displayName" style="font-size: 0.8rem; color: var(--muted)">Name</label>
                <input
                  id="displayName"
                  type="text"
                  maxlength="24"
                  placeholder="you"
                  autocomplete="off"
                  style="
                    width: 10.5rem;
                    padding: 0.25rem 0.4rem;
                    border-radius: 6px;
                    border: 1px solid var(--border);
                    background: var(--surface);
                    color: var(--text);
                    font: inherit;
                    font-size: 0.85rem;
                  "
                />
              </span>
            </span>
            <span id="chatStatus" style="font-size: 0.8rem; color: var(--muted)">offline</span>
          </span>
        </div>
        <div class="chat-messages" id="chatMessages" role="log" aria-live="polite"></div>
        <form class="chat-form" id="chatForm">
          <input
            type="text"
            id="chatInput"
            maxlength="500"
            placeholder="Say something…"
            autocomplete="off"
            aria-label="Message"
          />
          <button type="button" id="btnDraw" title="Draw">Draw</button>
          <button type="submit">Send</button>
        </form>
      </aside>
    </div>

    <div class="draw-window" id="drawModal" role="dialog" aria-label="Drawing pad">
      <div class="draw-header" id="drawHeader">
        <span>Drawing pad</span>
        <button
          type="button"
          id="btnCloseDraw"
          aria-label="Close"
          style="background: transparent; border: none; color: var(--text); cursor: pointer; font-size: 1.1rem"
        >
          ✕
        </button>
      </div>
      <div class="draw-body">
        <div class="draw-toolbar">
          <span class="group">
            <label for="drawColor">Color</label>
            <input id="drawColor" type="color" value="#111111" />
          </span>
          <span class="group">
            <label for="drawSize">Brush</label>
            <input id="drawSize" type="range" min="2" max="28" step="1" value="8" />
          </span>
        </div>
        <canvas id="drawCanvas" class="draw-canvas" width="1200" height="720"></canvas>
        <div class="modal-actions">
          <button type="button" id="btnClearDraw">Clear</button>
          <button type="button" id="btnSendDraw" class="primary">Send to chat</button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const media = document.getElementById("media");
        const btnPlay = document.getElementById("btnPlay");
        const btnMute = document.getElementById("btnMute");
        const btnFs = document.getElementById("btnFs");
        const seek = document.getElementById("seek");
        const volume = document.getElementById("volume");
        const timeCurrent = document.getElementById("timeCurrent");
        const timeDuration = document.getElementById("timeDuration");
        const urlInput = document.getElementById("urlInput");
        const btnLoadUrl = document.getElementById("btnLoadUrl");
        const fileInput = document.getElementById("fileInput");
        const youtubeFrame = document.getElementById("youtubeFrame");
        const chatMessages = document.getElementById("chatMessages");
        const chatForm = document.getElementById("chatForm");
        const chatInput = document.getElementById("chatInput");
        const btnDraw = document.getElementById("btnDraw");
        const drawModal = document.getElementById("drawModal");
        const btnCloseDraw = document.getElementById("btnCloseDraw");
        const drawHeader = document.getElementById("drawHeader");
        const drawCanvas = document.getElementById("drawCanvas");
        const drawColor = document.getElementById("drawColor");
        const drawSize = document.getElementById("drawSize");
        const btnClearDraw = document.getElementById("btnClearDraw");
        const btnSendDraw = document.getElementById("btnSendDraw");
        const displayName = document.getElementById("displayName");
        const roomCode = document.getElementById("roomCode");
        const chatStatus = document.getElementById("chatStatus");

        let objectUrl = null;
        let activeSource = "html5";
        let ws = null;
        let applyingRemoteControl = false;
        let pendingRemoteControl = null;
        let ytPlayer = null;
        let ytReady = null;
        let ytVideoId = null;

        function ensureYouTubeApi() {
          if (ytReady) return ytReady;
          ytReady = new Promise(function (resolve) {
            if (window.YT && window.YT.Player) {
              resolve(window.YT);
              return;
            }
            const prev = window.onYouTubeIframeAPIReady;
            window.onYouTubeIframeAPIReady = function () {
              try {
                if (typeof prev === "function") prev();
              } catch (_) {}
              resolve(window.YT);
            };
            const s = document.createElement("script");
            s.src = "https://www.youtube.com/iframe_api";
            s.async = true;
            document.head.appendChild(s);
          });
          return ytReady;
        }

        function formatTime(sec) {
          if (!Number.isFinite(sec) || sec < 0) return "0:00";
          const m = Math.floor(sec / 60);
          const s = Math.floor(sec % 60);
          return m + ":" + String(s).padStart(2, "0");
        }

        function setPlayIcon(playing) {
          btnPlay.textContent = playing ? "⏸" : "▶";
          btnPlay.setAttribute("aria-label", playing ? "Pause" : "Play");
        }

        function setMuteIcon(muted) {
          btnMute.textContent = muted ? "🔇" : "🔊";
          btnMute.setAttribute("aria-label", muted ? "Unmute" : "Mute");
        }

        function updateDuration() {
          const d = media.duration;
          timeDuration.textContent = formatTime(d);
          seek.disabled = !Number.isFinite(d) || d <= 0;
        }

        function syncSeekFromVideo() {
          const d = media.duration;
          if (!Number.isFinite(d) || d <= 0) {
            seek.value = 0;
            return;
          }
          if (!seek.dataset.dragging) {
            seek.value = String((media.currentTime / d) * 1000);
          }
          timeCurrent.textContent = formatTime(media.currentTime);
        }

        media.addEventListener("loadedmetadata", function () {
          updateDuration();
          syncSeekFromVideo();
          if (pendingRemoteControl) {
            const fn = pendingRemoteControl;
            pendingRemoteControl = null;
            fn();
          }
        });

        media.addEventListener("timeupdate", syncSeekFromVideo);
        media.addEventListener("play", function () {
          setPlayIcon(true);
        });
        media.addEventListener("pause", function () {
          setPlayIcon(false);
        });
        media.addEventListener("volumechange", function () {
          volume.value = String(media.volume);
          setMuteIcon(media.muted);
        });

        btnPlay.addEventListener("click", function () {
          if (activeSource === "youtube") {
            if (!ytPlayer || typeof ytPlayer.getPlayerState !== "function") return;
            const state = ytPlayer.getPlayerState();
            const isPlaying = state === 1;
            const action = isPlaying ? "pause" : "play";
            const t =
              typeof ytPlayer.getCurrentTime === "function" ? Number(ytPlayer.getCurrentTime()) : 0;
            if (action === "play") ytPlayer.playVideo?.();
            else ytPlayer.pauseVideo?.();

            if (applyingRemoteControl) return;
            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(
                JSON.stringify({
                  type: "control",
                  room: getRoom(),
                  source: "youtube",
                  videoId: ytVideoId,
                  action,
                  time: Number.isFinite(t) ? t : 0,
                  sentAt: Date.now(),
                })
              );
            }
            return;
          }

          if (media.paused) {
            media.play().catch(function () {});
          } else {
            media.pause();
          }

          if (activeSource !== "html5") return;
          if (applyingRemoteControl) return;
          if (ws && ws.readyState === WebSocket.OPEN) {
            const action = media.paused ? "play" : "pause";
            ws.send(
              JSON.stringify({
                type: "control",
                room: getRoom(),
                source: "html5",
                action,
                time: Number.isFinite(media.currentTime) ? media.currentTime : 0,
                sentAt: Date.now(),
              })
            );
          }
        });

        btnMute.addEventListener("click", function () {
          media.muted = !media.muted;
        });

        volume.addEventListener("input", function () {
          media.volume = Number(volume.value);
          if (media.volume > 0 && media.muted) media.muted = false;
        });

        seek.addEventListener("pointerdown", function () {
          seek.dataset.dragging = "1";
        });
        seek.addEventListener("pointerup", function () {
          delete seek.dataset.dragging;
        });
        seek.addEventListener("change", function () {
          const d = media.duration;
          if (Number.isFinite(d) && d > 0) {
            media.currentTime = (Number(seek.value) / 1000) * d;
          }
        });
        seek.addEventListener("input", function () {
          const d = media.duration;
          if (Number.isFinite(d) && d > 0) {
            media.currentTime = (Number(seek.value) / 1000) * d;
            timeCurrent.textContent = formatTime(media.currentTime);
          }
        });

        btnFs.addEventListener("click", function () {
          const wrap = media.closest(".video-wrap");
          if (!document.fullscreenElement) {
            (wrap || media).requestFullscreen?.().catch(function () {});
          } else {
            document.exitFullscreen?.();
          }
        });

        function revokeObject() {
          if (objectUrl) {
            URL.revokeObjectURL(objectUrl);
            objectUrl = null;
          }
        }

        function parseYouTubeId(inputUrl) {
          const pattern =
            /(?:youtube\.com\/(?:watch\?[^#\n\r]*?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/i;

          try {
            const raw = String(inputUrl || "").trim();
            if (!raw) return null;
            const m = raw.match(pattern);
            return m ? m[1] : null;
          } catch (_) {
            return null;
          }
        }

        function setControlsEnabled(enabled) {
          btnPlay.disabled = !enabled;
          btnMute.disabled = !enabled;
          seek.disabled = !enabled;
          volume.disabled = !enabled;
        }

        function switchToHtml5Mode() {
          activeSource = "html5";
          youtubeFrame.style.display = "none";
          ytVideoId = null;
          media.style.display = "block";
          setControlsEnabled(true);
          updateDuration();
          syncSeekFromVideo();
        }

        function switchToYouTubeMode(videoId) {
          activeSource = "youtube";
          ytVideoId = videoId;
          media.pause();
          media.removeAttribute("src");
          media.load();
          media.style.display = "none";
          youtubeFrame.style.display = "block";
          // With the YouTube API we can support play/pause, but not the HTML5 volume/seek UI.
          btnPlay.disabled = false;
          btnFs.disabled = false;
          btnMute.disabled = true;
          seek.disabled = true;
          volume.disabled = true;
          seek.value = "0";
          timeCurrent.textContent = "0:00";
          timeDuration.textContent = "--:--";
          setPlayIcon(false);
          setMuteIcon(false);

          ensureYouTubeApi()
            .then(function (YT) {
              if (!YT || !YT.Player) return;

              if (!ytPlayer) {
                ytPlayer = new YT.Player("youtubeFrame", {
                  height: "100%",
                  width: "100%",
                  videoId: videoId,
                  playerVars: {
                    playsinline: 1,
                    rel: 0,
                  },
                  events: {
                    onReady: function () {
                      // nothing
                    },
                    onStateChange: function (e) {
                      // 1 = playing, 2 = paused
                      if (e && e.data === 1) setPlayIcon(true);
                      if (e && e.data === 2) setPlayIcon(false);
                    },
                  },
                });
              } else {
                ytPlayer.loadVideoById(videoId);
              }
            })
            .catch(function () {});
        }

        function sendMediaUrlToRoom(url) {
          const trimmed = String(url || "").trim();
          if (!trimmed) return;
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(
              JSON.stringify({
                type: "media",
                room: getRoom(),
                url: trimmed,
              })
            );
          }
        }

        function loadUrl(u, opts) {
          const trimmed = (u || "").trim();
          if (!trimmed) return;
          revokeObject();
          const youTubeId = parseYouTubeId(trimmed);
          if (youTubeId) {
            switchToYouTubeMode(youTubeId);
            addSystemMessage("Loaded YouTube video.");
            return;
          }
          if (/youtu\.?be|youtube\.com/i.test(trimmed)) {
            addSystemMessage("Could not read that YouTube link. Try a full watch/share URL.");
            return;
          }
          switchToHtml5Mode();
          media.removeAttribute("poster");
          media.src = trimmed;
          media.load();
          addSystemMessage("Loaded media from URL.");
        }

        btnLoadUrl.addEventListener("click", function () {
          const u = urlInput.value;
          loadUrl(u);
          sendMediaUrlToRoom(u);
        });

        fileInput.addEventListener("change", function () {
          const f = fileInput.files && fileInput.files[0];
          if (!f) return;
          revokeObject();
          switchToHtml5Mode();
          objectUrl = URL.createObjectURL(f);
          media.removeAttribute("poster");
          media.src = objectUrl;
          media.load();
          addSystemMessage("Playing local file: " + f.name);
          fileInput.value = "";
        });

        function nowClock() {
          const t = new Date();
          return t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        }

        function addMessage(text, opts) {
          const div = document.createElement("div");
          div.className = "msg" + (opts && opts.system ? " system" : "");
          if (opts && opts.system) {
            div.textContent = text;
          } else {
            const meta = document.createElement("div");
            meta.className = "meta";
            const who = (opts && opts.who) || "You";
            const when = (opts && opts.when) || nowClock();
            meta.textContent = who + " · " + when;
            const body = document.createElement("div");
            if (opts && opts.htmlNode) {
              body.appendChild(opts.htmlNode);
            } else {
              body.textContent = text;
            }
            div.appendChild(meta);
            div.appendChild(body);
          }
          chatMessages.appendChild(div);
          chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addSystemMessage(text) {
          addMessage(text, { system: true });
        }

        function getSavedName() {
          try {
            return localStorage.getItem("chatName") || "";
          } catch (_) {
            return "";
          }
        }

        function saveName(name) {
          try {
            localStorage.setItem("chatName", name);
          } catch (_) {}
        }

        function getSavedRoom() {
          try {
            return localStorage.getItem("chatRoom") || "";
          } catch (_) {
            return "";
          }
        }

        function saveRoom(room) {
          try {
            localStorage.setItem("chatRoom", room);
          } catch (_) {}
        }

        function getName() {
          const raw = (displayName.value || "").trim();
          return raw ? raw.slice(0, 24) : "Guest";
        }

        function normalizeRoom(input) {
          const raw = String(input || "")
            .trim()
            .toUpperCase()
            .replace(/[^A-Z0-9]/g, "")
            .slice(0, 10);
          return raw || "LOBBY";
        }

        function getRoom() {
          return normalizeRoom(roomCode.value);
        }

        function setRoom(room) {
          const r = normalizeRoom(room);
          roomCode.value = r;
          saveRoom(r);
          try {
            const url = new URL(window.location.href);
            url.searchParams.set("room", r);
            history.replaceState(null, "", url.toString());
          } catch (_) {}
        }

        function setStatus(text) {
          chatStatus.textContent = text;
          chatStatus.style.color = text === "online" ? "var(--accent-hover)" : "var(--muted)";
        }

        function wsUrl() {
          if (!window.location || !window.location.host) return null;
          const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
          return proto + "//" + window.location.host + "/ws";
        }

        function connectChat() {
          const url = wsUrl();
          if (!url) {
            setStatus("offline");
            addSystemMessage("To use multi-person chat, run the server and open this page from http://localhost:3000 (not file://).");
            return;
          }

          try {
            ws = new WebSocket(url);
          } catch (_) {
            setStatus("offline");
            addSystemMessage("Could not connect to chat server.");
            return;
          }

          setStatus("connecting…");

          ws.addEventListener("open", function () {
            setStatus("online");
            ws.send(
              JSON.stringify({
                type: "join",
                name: getName(),
                room: getRoom(),
              })
            );
          });

          ws.addEventListener("message", function (evt) {
            let data = null;
            try {
              data = JSON.parse(String(evt.data));
            } catch (_) {
              return;
            }
            if (!data || typeof data !== "object") return;

            if (data.type === "system" && typeof data.text === "string") {
              addSystemMessage(data.text);
              return;
            }

            if (data.type === "chat" && typeof data.text === "string") {
              addMessage(data.text, {
                who: typeof data.name === "string" && data.name.trim() ? data.name : "Someone",
                when: typeof data.time === "string" && data.time ? data.time : nowClock(),
              });
            }

            if (data.type === "media" && typeof data.url === "string") {
              loadUrl(data.url);
              urlInput.value = data.url;
              addSystemMessage("Synced media from room.");
            }

            if (data.type === "control") {
              const source = String(data.source || "html5");
              const action = String(data.action || "");
              const t = Number(data.time);
              const sentAt = Number(data.sentAt);
              if ((action !== "play" && action !== "pause") || !Number.isFinite(t) || t < 0) return;
              if (!Number.isFinite(sentAt) || sentAt <= 0) return;

              const lagSec = Math.max(0, (Date.now() - sentAt) / 1000);
              const targetTime = action === "play" ? t + lagSec : t;

              if (source === "youtube") {
                if (activeSource !== "youtube") return;
                if (!ytPlayer) return;
                const applyYt = function () {
                  applyingRemoteControl = true;
                  try {
                    ytPlayer.seekTo?.(targetTime, true);
                    if (action === "play") ytPlayer.playVideo?.();
                    else ytPlayer.pauseVideo?.();
                  } finally {
                    setTimeout(function () {
                      applyingRemoteControl = false;
                    }, 250);
                  }
                };
                applyYt();
                return;
              }

              if (activeSource !== "html5") return;
              if (!media || !media.src) return;

              const apply = function () {
                applyingRemoteControl = true;
                try {
                  media.currentTime = targetTime;
                  if (action === "play") {
                    media.play().catch(function () {});
                  } else {
                    media.pause();
                  }
                } finally {
                  setTimeout(function () {
                    applyingRemoteControl = false;
                  }, 250);
                }
              };

              if (!Number.isFinite(media.duration) || media.duration <= 0) {
                pendingRemoteControl = apply;
                return;
              }
              apply();
            }

            if (data.type === "drawing" && typeof data.dataUrl === "string") {
              const img = document.createElement("img");
              img.className = "drawing";
              img.alt = "Drawing";
              img.src = data.dataUrl;
              addMessage("", {
                who: typeof data.name === "string" && data.name.trim() ? data.name : "Someone",
                when: typeof data.time === "string" && data.time ? data.time : nowClock(),
                htmlNode: img,
              });
            }
          });

          ws.addEventListener("close", function () {
            setStatus("offline");
            ws = null;
            addSystemMessage("Disconnected from chat server.");
          });

          ws.addEventListener("error", function () {
            setStatus("offline");
          });
        }

        chatForm.addEventListener("submit", function (e) {
          e.preventDefault();
          const text = chatInput.value.trim();
          if (!text) return;
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(
              JSON.stringify({
                type: "chat",
                name: getName(),
                room: getRoom(),
                text,
              })
            );
          } else {
            addMessage(text, { who: "You" });
            addSystemMessage("Not connected — start the server to chat with others.");
          }
          chatInput.value = "";
          chatInput.focus();
        });

        function openDraw() {
          drawModal.style.display = "block";
        }

        function closeDraw() {
          drawModal.style.display = "none";
        }

        function clearCanvas() {
          const ctx = drawCanvas.getContext("2d");
          if (!ctx) return;
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
        }

        // Basic drawing (mouse/touch/pen)
        (function setupDrawing() {
          const ctx = drawCanvas.getContext("2d");
          if (!ctx) return;
          clearCanvas();
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.strokeStyle = drawColor.value || "#111111";
          ctx.lineWidth = Number(drawSize.value) || 8;

          let drawing = false;

          function pos(evt) {
            const r = drawCanvas.getBoundingClientRect();
            return {
              x: ((evt.clientX - r.left) / r.width) * drawCanvas.width,
              y: ((evt.clientY - r.top) / r.height) * drawCanvas.height,
            };
          }

          drawCanvas.addEventListener("pointerdown", function (e) {
            drawing = true;
            drawCanvas.setPointerCapture?.(e.pointerId);
            const p = pos(e);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
          });

          drawCanvas.addEventListener("pointermove", function (e) {
            if (!drawing) return;
            const p = pos(e);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
          });

          function stop(e) {
            if (!drawing) return;
            drawing = false;
            try {
              drawCanvas.releasePointerCapture?.(e.pointerId);
            } catch (_) {}
          }

          drawCanvas.addEventListener("pointerup", stop);
          drawCanvas.addEventListener("pointercancel", stop);

          drawColor.addEventListener("input", function () {
            ctx.strokeStyle = drawColor.value || "#111111";
          });
          drawSize.addEventListener("input", function () {
            const n = Number(drawSize.value);
            ctx.lineWidth = Number.isFinite(n) && n > 0 ? n : 8;
          });
        })();

        btnDraw.addEventListener("click", function () {
          openDraw();
        });
        btnCloseDraw.addEventListener("click", closeDraw);
        btnClearDraw.addEventListener("click", clearCanvas);
        btnSendDraw.addEventListener("click", function () {
          if (!(ws && ws.readyState === WebSocket.OPEN)) {
            addSystemMessage("Not connected — start the server to share drawings.");
            return;
          }
          const dataUrl = drawCanvas.toDataURL("image/png");
          ws.send(
            JSON.stringify({
              type: "drawing",
              room: getRoom(),
              name: getName(),
              dataUrl,
            })
          );
          closeDraw();
        });

        // Drag to reposition the drawing window
        (function setupDrawDrag() {
          let dragging = false;
          let startX = 0;
          let startY = 0;
          let startLeft = 0;
          let startTop = 0;

          function px(v) {
            return Math.round(v) + "px";
          }

          function clamp(n, min, max) {
            return Math.max(min, Math.min(max, n));
          }

          function currentLeftTop() {
            const r = drawModal.getBoundingClientRect();
            return { left: r.left, top: r.top };
          }

          drawHeader.addEventListener("pointerdown", function (e) {
            dragging = true;
            drawHeader.setPointerCapture?.(e.pointerId);
            const cur = currentLeftTop();
            startX = e.clientX;
            startY = e.clientY;
            startLeft = cur.left;
            startTop = cur.top;
            drawHeader.style.cursor = "grabbing";
            // switch from right-anchored to left/top anchored while dragging
            drawModal.style.right = "auto";
            drawModal.style.left = px(startLeft);
            drawModal.style.top = px(startTop);
          });

          drawHeader.addEventListener("pointermove", function (e) {
            if (!dragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            const maxLeft = window.innerWidth - drawModal.offsetWidth - 8;
            const maxTop = window.innerHeight - drawModal.offsetHeight - 8;
            const nextLeft = clamp(startLeft + dx, 8, Math.max(8, maxLeft));
            const nextTop = clamp(startTop + dy, 8, Math.max(8, maxTop));
            drawModal.style.left = px(nextLeft);
            drawModal.style.top = px(nextTop);
          });

          function stopDrag(e) {
            if (!dragging) return;
            dragging = false;
            try {
              drawHeader.releasePointerCapture?.(e.pointerId);
            } catch (_) {}
            drawHeader.style.cursor = "grab";
          }

          drawHeader.addEventListener("pointerup", stopDrag);
          drawHeader.addEventListener("pointercancel", stopDrag);
        })();

        setPlayIcon(!media.paused);
        setMuteIcon(media.muted);
        volume.value = String(media.volume);
        displayName.value = getSavedName();
        roomCode.value = getSavedRoom() || "LOBBY";

        try {
          const url = new URL(window.location.href);
          const roomFromUrl = url.searchParams.get("room");
          if (roomFromUrl) setRoom(roomFromUrl);
        } catch (_) {}

        displayName.addEventListener("change", function () {
          saveName(getName());
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "join", name: getName(), room: getRoom() }));
          }
        });

        roomCode.addEventListener("change", function () {
          setRoom(getRoom());
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "join", name: getName(), room: getRoom() }));
          }
        });

        addSystemMessage("Starting chat… (requires local server)");
        connectChat();

        media.addEventListener("ended", function () {
          addSystemMessage("Playback finished.");
        });
      })();
    </script>
  </body>
</html>
