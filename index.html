<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media player & chat</title>
    <style>
      :root {
        --bg: #0f1114;
        --surface: #1a1d23;
        --surface-2: #242830;
        --border: #2e3440;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --accent: #5b8def;
        --accent-hover: #7aa3f5;
        --chat-bubble: #2d3340;
        --radius: 10px;
        --font: system-ui, "Segoe UI", Roboto, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        line-height: 1.5;
      }

      .app {
        max-width: 1200px;
        margin: 0 auto;
        padding: 1.25rem;
        display: grid;
        gap: 1rem;
        grid-template-columns: 1fr minmax(280px, 340px);
        align-items: stretch;
        min-height: 100vh;
      }

      @media (max-width: 900px) {
        .app {
          grid-template-columns: 1fr;
        }
      }

      .player-panel {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .player-shell {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      }

      .video-wrap {
        position: relative;
        aspect-ratio: 16 / 9;
        background: #000;
      }

      .video-wrap video {
        width: 100%;
        height: 100%;
        display: block;
      }

      .video-wrap iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: none;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 0.75rem;
        padding: 0.65rem 0.85rem;
        background: var(--surface-2);
        border-top: 1px solid var(--border);
      }

      .controls button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 2.25rem;
        height: 2.25rem;
        padding: 0 0.5rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-size: 0.9rem;
      }

      .controls button:hover {
        border-color: var(--accent);
        color: var(--accent-hover);
      }

      .controls button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .progress-row {
        flex: 1 1 100%;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .time {
        font-variant-numeric: tabular-nums;
        font-size: 0.8rem;
        color: var(--muted);
        white-space: nowrap;
      }

      input[type="range"].seek {
        flex: 1;
        height: 6px;
        accent-color: var(--accent);
        cursor: pointer;
      }

      input[type="range"].vol {
        width: 88px;
        accent-color: var(--accent);
        cursor: pointer;
      }

      .source-row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        align-items: center;
      }

      .source-row label {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .source-row input[type="url"],
      .source-row input[type="file"] {
        flex: 1 1 180px;
        min-width: 0;
        padding: 0.45rem 0.6rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-size: 0.85rem;
      }

      .source-row button.apply {
        padding: 0.45rem 0.85rem;
        border-radius: 6px;
        border: none;
        background: var(--accent);
        color: #0b0d10;
        font-weight: 600;
        cursor: pointer;
        font: inherit;
        font-size: 0.85rem;
      }

      .source-row button.apply:hover {
        background: var(--accent-hover);
      }

      .chat-panel {
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        min-height: 420px;
        max-height: min(85vh, 720px);
      }

      .chat-header {
        padding: 0.75rem 1rem;
        background: var(--surface-2);
        border-bottom: 1px solid var(--border);
        font-weight: 600;
        font-size: 0.95rem;
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 0.75rem 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }

      .msg {
        max-width: 95%;
        align-self: flex-start;
        padding: 0.5rem 0.75rem;
        border-radius: 8px 8px 8px 2px;
        background: var(--chat-bubble);
        font-size: 0.9rem;
        word-break: break-word;
      }

      .msg .meta {
        font-size: 0.72rem;
        color: var(--muted);
        margin-bottom: 0.2rem;
      }

      .msg.system {
        align-self: center;
        background: transparent;
        border: 1px dashed var(--border);
        font-size: 0.8rem;
        color: var(--muted);
      }

      .chat-form {
        display: flex;
        gap: 0.5rem;
        padding: 0.75rem;
        border-top: 1px solid var(--border);
        background: var(--surface-2);
      }

      .chat-form input[type="text"] {
        flex: 1;
        min-width: 0;
        padding: 0.55rem 0.75rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-size: 0.9rem;
      }

      .chat-form input[type="text"]:focus {
        outline: none;
        border-color: var(--accent);
      }

      .chat-form button {
        padding: 0.55rem 1rem;
        border-radius: 6px;
        border: none;
        background: var(--accent);
        color: #0b0d10;
        font-weight: 600;
        cursor: pointer;
        font: inherit;
        font-size: 0.9rem;
      }

      .chat-form button:hover {
        background: var(--accent-hover);
      }

      h1.page-title {
        margin: 0 0 0.25rem;
        font-size: 1.25rem;
        font-weight: 600;
      }

      .subtitle {
        margin: 0 0 0.5rem;
        font-size: 0.85rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="player-panel">
        <header>
          <h1 class="page-title">Media player</h1>
          <p class="subtitle">Play video or audio; chat updates as you watch.</p>
        </header>

        <div class="player-shell">
          <div class="video-wrap">
            <video
              id="media"
              playsinline
              preload="metadata"
              poster=""
            >
              <source
                src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
                type="video/mp4"
              />
              Your browser does not support HTML5 video.
            </video>
            <iframe
              id="youtubeFrame"
              title="YouTube player"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen
            ></iframe>
          </div>
          <div class="controls" role="toolbar" aria-label="Playback controls">
            <button type="button" id="btnPlay" aria-label="Play">▶</button>
            <div class="progress-row">
              <span class="time" id="timeCurrent">0:00</span>
              <input
                type="range"
                class="seek"
                id="seek"
                min="0"
                max="1000"
                value="0"
                step="1"
                aria-label="Seek"
              />
              <span class="time" id="timeDuration">0:00</span>
            </div>
            <button type="button" id="btnMute" aria-label="Mute">🔊</button>
            <input
              type="range"
              class="vol"
              id="volume"
              min="0"
              max="1"
              value="1"
              step="0.05"
              aria-label="Volume"
            />
            <button type="button" id="btnFs" aria-label="Fullscreen">⛶</button>
          </div>
        </div>

        <div class="source-row">
          <label for="urlInput">URL</label>
          <input
            id="urlInput"
            type="url"
            placeholder="https://… (video or audio)"
            autocomplete="off"
          />
          <button type="button" class="apply" id="btnLoadUrl">Load URL</button>
          <label for="fileInput">File</label>
          <input id="fileInput" type="file" accept="video/*,audio/*" />
        </div>
      </div>

      <aside class="chat-panel" aria-label="Chat">
        <div class="chat-header">
          Live chat
          <span style="float: right; display: inline-flex; gap: 0.5rem; align-items: center">
            <label for="roomCode" style="font-size: 0.8rem; color: var(--muted)">Room</label>
            <input
              id="roomCode"
              type="text"
              maxlength="10"
              placeholder="LOBBY"
              autocomplete="off"
              style="
                width: 7.5rem;
                padding: 0.25rem 0.4rem;
                border-radius: 6px;
                border: 1px solid var(--border);
                background: var(--surface);
                color: var(--text);
                font: inherit;
                font-size: 0.85rem;
                text-transform: uppercase;
              "
            />
            <label for="displayName" style="font-size: 0.8rem; color: var(--muted)">Name</label>
            <input
              id="displayName"
              type="text"
              maxlength="24"
              placeholder="you"
              autocomplete="off"
              style="
                width: 9.5rem;
                padding: 0.25rem 0.4rem;
                border-radius: 6px;
                border: 1px solid var(--border);
                background: var(--surface);
                color: var(--text);
                font: inherit;
                font-size: 0.85rem;
              "
            />
            <span id="chatStatus" style="font-size: 0.8rem; color: var(--muted)">offline</span>
          </span>
        </div>
        <div class="chat-messages" id="chatMessages" role="log" aria-live="polite"></div>
        <form class="chat-form" id="chatForm">
          <input
            type="text"
            id="chatInput"
            maxlength="500"
            placeholder="Say something…"
            autocomplete="off"
            aria-label="Message"
          />
          <button type="submit">Send</button>
        </form>
      </aside>
    </div>

    <script>
      (function () {
        const media = document.getElementById("media");
        const btnPlay = document.getElementById("btnPlay");
        const btnMute = document.getElementById("btnMute");
        const btnFs = document.getElementById("btnFs");
        const seek = document.getElementById("seek");
        const volume = document.getElementById("volume");
        const timeCurrent = document.getElementById("timeCurrent");
        const timeDuration = document.getElementById("timeDuration");
        const urlInput = document.getElementById("urlInput");
        const btnLoadUrl = document.getElementById("btnLoadUrl");
        const fileInput = document.getElementById("fileInput");
        const youtubeFrame = document.getElementById("youtubeFrame");
        const chatMessages = document.getElementById("chatMessages");
        const chatForm = document.getElementById("chatForm");
        const chatInput = document.getElementById("chatInput");
        const displayName = document.getElementById("displayName");
        const roomCode = document.getElementById("roomCode");
        const chatStatus = document.getElementById("chatStatus");

        let objectUrl = null;
        let activeSource = "html5";
        let ws = null;

        function formatTime(sec) {
          if (!Number.isFinite(sec) || sec < 0) return "0:00";
          const m = Math.floor(sec / 60);
          const s = Math.floor(sec % 60);
          return m + ":" + String(s).padStart(2, "0");
        }

        function setPlayIcon(playing) {
          btnPlay.textContent = playing ? "⏸" : "▶";
          btnPlay.setAttribute("aria-label", playing ? "Pause" : "Play");
        }

        function setMuteIcon(muted) {
          btnMute.textContent = muted ? "🔇" : "🔊";
          btnMute.setAttribute("aria-label", muted ? "Unmute" : "Mute");
        }

        function updateDuration() {
          const d = media.duration;
          timeDuration.textContent = formatTime(d);
          seek.disabled = !Number.isFinite(d) || d <= 0;
        }

        function syncSeekFromVideo() {
          const d = media.duration;
          if (!Number.isFinite(d) || d <= 0) {
            seek.value = 0;
            return;
          }
          if (!seek.dataset.dragging) {
            seek.value = String((media.currentTime / d) * 1000);
          }
          timeCurrent.textContent = formatTime(media.currentTime);
        }

        media.addEventListener("loadedmetadata", function () {
          updateDuration();
          syncSeekFromVideo();
        });

        media.addEventListener("timeupdate", syncSeekFromVideo);
        media.addEventListener("play", function () {
          setPlayIcon(true);
        });
        media.addEventListener("pause", function () {
          setPlayIcon(false);
        });
        media.addEventListener("volumechange", function () {
          volume.value = String(media.volume);
          setMuteIcon(media.muted);
        });

        btnPlay.addEventListener("click", function () {
          if (media.paused) {
            media.play().catch(function () {});
          } else {
            media.pause();
          }
        });

        btnMute.addEventListener("click", function () {
          media.muted = !media.muted;
        });

        volume.addEventListener("input", function () {
          media.volume = Number(volume.value);
          if (media.volume > 0 && media.muted) media.muted = false;
        });

        seek.addEventListener("pointerdown", function () {
          seek.dataset.dragging = "1";
        });
        seek.addEventListener("pointerup", function () {
          delete seek.dataset.dragging;
        });
        seek.addEventListener("change", function () {
          const d = media.duration;
          if (Number.isFinite(d) && d > 0) {
            media.currentTime = (Number(seek.value) / 1000) * d;
          }
        });
        seek.addEventListener("input", function () {
          const d = media.duration;
          if (Number.isFinite(d) && d > 0) {
            media.currentTime = (Number(seek.value) / 1000) * d;
            timeCurrent.textContent = formatTime(media.currentTime);
          }
        });

        btnFs.addEventListener("click", function () {
          const wrap = media.closest(".video-wrap");
          if (!document.fullscreenElement) {
            (wrap || media).requestFullscreen?.().catch(function () {});
          } else {
            document.exitFullscreen?.();
          }
        });

        function revokeObject() {
          if (objectUrl) {
            URL.revokeObjectURL(objectUrl);
            objectUrl = null;
          }
        }

        function parseYouTubeId(inputUrl) {
          const pattern =
            /(?:youtube\.com\/(?:watch\?[^#\n\r]*?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/i;

          try {
            const raw = String(inputUrl || "").trim();
            if (!raw) return null;
            const m = raw.match(pattern);
            return m ? m[1] : null;
          } catch (_) {
            return null;
          }
        }

        function setControlsEnabled(enabled) {
          btnPlay.disabled = !enabled;
          btnMute.disabled = !enabled;
          seek.disabled = !enabled;
          volume.disabled = !enabled;
        }

        function switchToHtml5Mode() {
          activeSource = "html5";
          youtubeFrame.style.display = "none";
          youtubeFrame.src = "";
          media.style.display = "block";
          setControlsEnabled(true);
          updateDuration();
          syncSeekFromVideo();
        }

        function switchToYouTubeMode(embedSrc) {
          activeSource = "youtube";
          media.pause();
          media.removeAttribute("src");
          media.load();
          media.style.display = "none";
          youtubeFrame.src = embedSrc;
          youtubeFrame.style.display = "block";
          setControlsEnabled(false);
          seek.value = "0";
          timeCurrent.textContent = "0:00";
          timeDuration.textContent = "--:--";
          setPlayIcon(false);
          setMuteIcon(false);
        }

        function loadUrl(u) {
          const trimmed = (u || "").trim();
          if (!trimmed) return;
          revokeObject();
          const youTubeId = parseYouTubeId(trimmed);
          if (youTubeId) {
            const originParam =
              window.location.origin && window.location.origin !== "null"
                ? "&origin=" + encodeURIComponent(window.location.origin)
                : "";
            const embedSrc =
              "https://www.youtube.com/embed/" +
              youTubeId +
              "?rel=0&playsinline=1" +
              originParam;
            switchToYouTubeMode(embedSrc);
            addSystemMessage("Loaded YouTube video.");
            return;
          }
          if (/youtu\.?be|youtube\.com/i.test(trimmed)) {
            addSystemMessage("Could not read that YouTube link. Try a full watch/share URL.");
            return;
          }
          switchToHtml5Mode();
          media.removeAttribute("poster");
          media.src = trimmed;
          media.load();
          addSystemMessage("Loaded media from URL.");
        }

        btnLoadUrl.addEventListener("click", function () {
          loadUrl(urlInput.value);
        });

        fileInput.addEventListener("change", function () {
          const f = fileInput.files && fileInput.files[0];
          if (!f) return;
          revokeObject();
          switchToHtml5Mode();
          objectUrl = URL.createObjectURL(f);
          media.removeAttribute("poster");
          media.src = objectUrl;
          media.load();
          addSystemMessage("Playing local file: " + f.name);
          fileInput.value = "";
        });

        function nowClock() {
          const t = new Date();
          return t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        }

        function addMessage(text, opts) {
          const div = document.createElement("div");
          div.className = "msg" + (opts && opts.system ? " system" : "");
          if (opts && opts.system) {
            div.textContent = text;
          } else {
            const meta = document.createElement("div");
            meta.className = "meta";
            const who = (opts && opts.who) || "You";
            const when = (opts && opts.when) || nowClock();
            meta.textContent = who + " · " + when;
            const body = document.createElement("div");
            body.textContent = text;
            div.appendChild(meta);
            div.appendChild(body);
          }
          chatMessages.appendChild(div);
          chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addSystemMessage(text) {
          addMessage(text, { system: true });
        }

        function getSavedName() {
          try {
            return localStorage.getItem("chatName") || "";
          } catch (_) {
            return "";
          }
        }

        function saveName(name) {
          try {
            localStorage.setItem("chatName", name);
          } catch (_) {}
        }

        function getSavedRoom() {
          try {
            return localStorage.getItem("chatRoom") || "";
          } catch (_) {
            return "";
          }
        }

        function saveRoom(room) {
          try {
            localStorage.setItem("chatRoom", room);
          } catch (_) {}
        }

        function getName() {
          const raw = (displayName.value || "").trim();
          return raw ? raw.slice(0, 24) : "Guest";
        }

        function normalizeRoom(input) {
          const raw = String(input || "")
            .trim()
            .toUpperCase()
            .replace(/[^A-Z0-9]/g, "")
            .slice(0, 10);
          return raw || "LOBBY";
        }

        function getRoom() {
          return normalizeRoom(roomCode.value);
        }

        function setRoom(room) {
          const r = normalizeRoom(room);
          roomCode.value = r;
          saveRoom(r);
          try {
            const url = new URL(window.location.href);
            url.searchParams.set("room", r);
            history.replaceState(null, "", url.toString());
          } catch (_) {}
        }

        function setStatus(text) {
          chatStatus.textContent = text;
          chatStatus.style.color = text === "online" ? "var(--accent-hover)" : "var(--muted)";
        }

        function wsUrl() {
          if (!window.location || !window.location.host) return null;
          const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
          return proto + "//" + window.location.host + "/ws";
        }

        function connectChat() {
          const url = wsUrl();
          if (!url) {
            setStatus("offline");
            addSystemMessage("To use multi-person chat, run the server and open this page from http://localhost:3000 (not file://).");
            return;
          }

          try {
            ws = new WebSocket(url);
          } catch (_) {
            setStatus("offline");
            addSystemMessage("Could not connect to chat server.");
            return;
          }

          setStatus("connecting…");

          ws.addEventListener("open", function () {
            setStatus("online");
            ws.send(
              JSON.stringify({
                type: "join",
                name: getName(),
                room: getRoom(),
              })
            );
          });

          ws.addEventListener("message", function (evt) {
            let data = null;
            try {
              data = JSON.parse(String(evt.data));
            } catch (_) {
              return;
            }
            if (!data || typeof data !== "object") return;

            if (data.type === "system" && typeof data.text === "string") {
              addSystemMessage(data.text);
              return;
            }

            if (data.type === "chat" && typeof data.text === "string") {
              addMessage(data.text, {
                who: typeof data.name === "string" && data.name.trim() ? data.name : "Someone",
                when: typeof data.time === "string" && data.time ? data.time : nowClock(),
              });
            }
          });

          ws.addEventListener("close", function () {
            setStatus("offline");
            ws = null;
            addSystemMessage("Disconnected from chat server.");
          });

          ws.addEventListener("error", function () {
            setStatus("offline");
          });
        }

        chatForm.addEventListener("submit", function (e) {
          e.preventDefault();
          const text = chatInput.value.trim();
          if (!text) return;
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(
              JSON.stringify({
                type: "chat",
                name: getName(),
                room: getRoom(),
                text,
              })
            );
          } else {
            addMessage(text, { who: "You" });
            addSystemMessage("Not connected — start the server to chat with others.");
          }
          chatInput.value = "";
          chatInput.focus();
        });

        setPlayIcon(!media.paused);
        setMuteIcon(media.muted);
        volume.value = String(media.volume);
        displayName.value = getSavedName();
        roomCode.value = getSavedRoom() || "LOBBY";

        try {
          const url = new URL(window.location.href);
          const roomFromUrl = url.searchParams.get("room");
          if (roomFromUrl) setRoom(roomFromUrl);
        } catch (_) {}

        displayName.addEventListener("change", function () {
          saveName(getName());
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "join", name: getName(), room: getRoom() }));
          }
        });

        roomCode.addEventListener("change", function () {
          setRoom(getRoom());
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "join", name: getName(), room: getRoom() }));
          }
        });

        addSystemMessage("Starting chat… (requires local server)");
        connectChat();

        media.addEventListener("ended", function () {
          addSystemMessage("Playback finished.");
        });
      })();
    </script>
  </body>
</html>
