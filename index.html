<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media player & chat</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-title">Watch party</div>
          <div class="brand-subtitle">Synced video + room chat + drawings</div>
        </div>
        <div class="topbar-right">
          <div class="topbar-hint">
            Tip: share a room link like
            <span style="font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
              >?room=ABC123</span
            >
          </div>
          <button type="button" id="themeToggle" class="btn icon" aria-label="Toggle theme">
            ☾
          </button>
        </div>
      </div>
    </header>
    <div class="app">
      <div class="player-panel">
        <header>
          <h1 class="page-title">Media player</h1>
          <p class="subtitle">Play video or audio; chat updates as you watch.</p>
        </header>

        <div class="player-shell">
          <div class="video-wrap">
            <video
              id="media"
              playsinline
              preload="metadata"
              poster=""
            >
              <source
                src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
                type="video/mp4"
              />
              Your browser does not support HTML5 video.
            </video>
            <div
              id="youtubeFrame"
              title="YouTube player"
              style="display: none; width: 100%; height: 100%"
            ></div>
          </div>
          <div class="controls" role="toolbar" aria-label="Playback controls">
            <button type="button" id="btnPlay" class="btn icon" aria-label="Play">▶</button>
            <div class="progress-row">
              <span class="time" id="timeCurrent">0:00</span>
              <input
                type="range"
                class="seek"
                id="seek"
                min="0"
                max="1000"
                value="0"
                step="1"
                aria-label="Seek"
              />
              <span class="time" id="timeDuration">0:00</span>
            </div>
            <button type="button" id="btnMute" class="btn icon" aria-label="Mute">🔊</button>
            <input
              type="range"
              class="vol"
              id="volume"
              min="0"
              max="1"
              value="1"
              step="0.05"
              aria-label="Volume"
            />
            <button type="button" id="btnFs" class="btn icon" aria-label="Fullscreen">⛶</button>
          </div>
        </div>

        <div class="source-row">
          <label for="urlInput">URL</label>
          <input
            id="urlInput"
            type="url"
            placeholder="https://… (video or audio)"
            autocomplete="off"
          />
          <button type="button" class="btn primary apply" id="btnLoadUrl">Load URL</button>
        </div>
      </div>

      <aside class="chat-panel" aria-label="Chat">
        <div class="chat-header">
          Live chat
          <span style="float: right; display: inline-flex; gap: 0.6rem; align-items: center">
            <span style="display: inline-flex; flex-direction: column; gap: 0.35rem; align-items: flex-end">
              <span style="display: inline-flex; flex-direction: column; gap: 0.2rem; align-items: flex-end">
                <label for="roomCode" style="font-size: 0.8rem; color: var(--muted)">Room</label>
                <input
                  id="roomCode"
                  type="text"
                  maxlength="10"
                  placeholder="LOBBY"
                  autocomplete="off"
                  style="
                    width: 10.5rem;
                    padding: 0.25rem 0.4rem;
                    border-radius: 6px;
                    border: 1px solid var(--border);
                    background: var(--surface);
                    color: var(--text);
                    font: inherit;
                    font-size: 0.85rem;
                    text-transform: uppercase;
                  "
                />
              </span>
              <span style="display: inline-flex; flex-direction: column; gap: 0.2rem; align-items: flex-end">
                <label for="displayName" style="font-size: 0.8rem; color: var(--muted)">Name</label>
                <input
                  id="displayName"
                  type="text"
                  maxlength="24"
                  placeholder="you"
                  autocomplete="off"
                  style="
                    width: 10.5rem;
                    padding: 0.25rem 0.4rem;
                    border-radius: 6px;
                    border: 1px solid var(--border);
                    background: var(--surface);
                    color: var(--text);
                    font: inherit;
                    font-size: 0.85rem;
                  "
                />
              </span>
            </span>
            <span id="chatStatus" style="font-size: 0.8rem; color: var(--muted)">offline</span>
          </span>
        </div>
        <div class="chat-messages" id="chatMessages" role="log" aria-live="polite"></div>
        <form class="chat-form" id="chatForm">
          <input
            type="text"
            id="chatInput"
            maxlength="500"
            placeholder="Say something…"
            autocomplete="off"
            aria-label="Message"
          />
          <button type="button" id="btnDraw" class="btn" title="Draw">Draw</button>
          <button type="submit" class="btn primary">Send</button>
        </form>
        <div style="padding: 0.65rem 0.75rem; border-top: 1px solid var(--border); background: var(--surface)">
          <button type="button" id="btnTttInvite" class="btn" style="width: 100%">
            Tic‑Tac‑Toe
          </button>
        </div>
      </aside>
    </div>

    <div class="ttt-window" id="tttWindow" role="dialog" aria-label="Tic Tac Toe">
      <div class="ttt-header" id="tttHeader">
        <span>Tic‑Tac‑Toe</span>
        <button type="button" id="btnCloseTtt" class="btn icon" aria-label="Close">✕</button>
      </div>
      <div class="ttt-body">
        <div class="ttt-meta" id="tttStatus">Not in a game.</div>
        <div class="ttt-grid" id="tttGrid" aria-label="Board"></div>
      </div>
    </div>

    <div class="draw-window" id="drawModal" role="dialog" aria-label="Drawing pad">
      <div class="draw-header" id="drawHeader">
        <span>Drawing pad</span>
        <button
          type="button"
          id="btnCloseDraw"
          aria-label="Close"
          style="background: transparent; border: none; color: var(--text); cursor: pointer; font-size: 1.1rem"
        >
          ✕
        </button>
      </div>
      <div class="draw-body">
        <div class="draw-toolbar">
          <span class="group">
            <label for="drawColor">Color</label>
            <input id="drawColor" type="color" value="#111111" />
          </span>
          <span class="group">
            <label for="drawSize">Brush</label>
            <input id="drawSize" type="range" min="2" max="28" step="1" value="8" />
          </span>
        </div>
        <canvas id="drawCanvas" class="draw-canvas" width="1200" height="720"></canvas>
        <div class="modal-actions">
          <button type="button" id="btnClearDraw" class="btn">Clear</button>
          <button type="button" id="btnSendDraw" class="btn primary">Send to chat</button>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
