<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser Watch Party Player</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
  </head>
  <body>
    <main class="layout">
      <section class="panel">
        <h1>Watch Party Player</h1>
        <p class="muted">Synchronized media + room chat in your browser</p>

        <div class="grid two">
          <label>
            Username
            <input id="usernameInput" placeholder="Olivia" />
          </label>
          <label>
            Room ID
            <input id="roomInput" placeholder="movie-night" />
          </label>
        </div>

        <button id="joinBtn">Join Room</button>
        <button id="hostBtn" class="secondary">Become Host</button>

        <hr />

        <h2>Source</h2>
        <div class="grid two">
          <button id="modeUrl">Direct MP3/MP4 URL</button>
          <button id="modeYoutube">YouTube Link</button>
        </div>
        <label>
          URL / Link
          <input id="sourceInput" placeholder="https://..." />
        </label>
        <label>
          Local File (host stream)
          <input id="localFileInput" type="file" accept="audio/*,video/*" />
        </label>
        <button id="loadSourceBtn">Load Source</button>

        <p class="muted small">
          Note: Spotify/Apple Music are DRM-restricted in web embeds. You can still share links in chat.
        </p>
      </section>

      <section class="panel">
        <h2>Playback</h2>
        <div class="controls">
          <button id="playBtn">Play</button>
          <button id="pauseBtn">Pause</button>
          <button id="seekBackBtn">-10s</button>
          <button id="seekForwardBtn">+10s</button>
        </div>
        <div id="status" class="muted">Not connected</div>

        <div id="mediaContainer">
          <video id="nativePlayer" controls playsinline></video>
          <div id="youtubeHolder"></div>
          <video id="remoteStreamPlayer" controls autoplay playsinline></video>
        </div>
      </section>

      <section class="panel chat">
        <h2>Chat</h2>
        <div id="messages" class="messages"></div>
        <form id="chatForm">
          <input id="chatInput" placeholder="Type a message..." />
          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
